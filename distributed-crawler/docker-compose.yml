version: '3.9'
services:
  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawlerpass
      POSTGRES_DB: crawler
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '9200:9200'

  api:
    build: ./api
    depends_on:
      - rabbitmq
      - redis
      - postgres
      - elasticsearch
    environment:
      PORT: 4000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://crawler:crawlerpass@postgres:5432/crawler
      ELASTIC_URL: http://elasticsearch:9200
    ports:
      - '4000:4000'

  worker:
    build: ./worker
    depends_on:
      - rabbitmq
      - redis
      - postgres
      - elasticsearch
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgres://crawler:crawlerpass@postgres:5432/crawler
      ELASTIC_URL: http://elasticsearch:9200

volumes:
  redis-data:
  postgres-data:
