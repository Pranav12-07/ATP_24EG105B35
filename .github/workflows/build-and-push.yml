name: Build and Publish Docker images

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./distributed-crawler/api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-api:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./distributed-crawler/worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-worker:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./distributed-crawler/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest

      - name: Upload image tags
        run: echo "API image: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-api:latest" 
